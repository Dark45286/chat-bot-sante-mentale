<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Santé Mentale</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: #f2f5f9;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:20px;
        min-height:100vh;
    }

    h1 {
        color:#4A90E2;
        margin-bottom:20px;
        font-weight:600;
        text-align:center;
    }

    #chat {
        width:100%;
        max-width:600px;
        height:500px;
        background:#fff;
        border-radius:15px;
        padding:20px;
        overflow-y:auto;
        box-shadow:0 8px 20px rgba(0,0,0,0.1);
        display:flex;
        flex-direction:column;
        gap:10px;
    }

    .message-container {
        display:flex;
        align-items:flex-end;
        gap:10px;
    }

    .message {
        padding:12px 18px;
        border-radius:20px;
        max-width:75%;
        line-height:1.5;
        font-size:16px;
        position:relative;
        word-wrap:break-word;
    }

    .user .message {
        background:#d0e6ff;
        color:#1a1a1a;
        border-bottom-right-radius:0;
        margin-left:auto;
    }

    .bot .message {
        background:#4A90E2;
        color:#fff;
        border-bottom-left-radius:0;
        margin-right:auto;
    }

    .avatar {
        width:32px;
        height:32px;
        border-radius:50%;
        background:#ccc;
        display:flex;
        justify-content:center;
        align-items:center;
        font-weight:bold;
        color:#fff;
        flex-shrink:0;
    }

    /* Typing animation */
    .typing-dot {
        display:inline-block;
        width:6px;
        height:6px;
        margin:0 2px;
        background-color:#fff;
        border-radius:50%;
        animation: blink 1.4s infinite both;
    }
    .typing-dot:nth-child(1){animation-delay:0s;}
    .typing-dot:nth-child(2){animation-delay:0.2s;}
    .typing-dot:nth-child(3){animation-delay:0.4s;}
    @keyframes blink {
        0%,80%,100%{opacity:0;}
        40%{opacity:1;}
    }

    #inputForm {
        width:100%;
        max-width:600px;
        display:flex;
        margin-top:10px;
        box-shadow:0 4px 10px rgba(0,0,0,0.05);
        border-radius:10px;
        overflow:hidden;
    }

    #messageInput {
        flex:1;
        padding:14px 16px;
        border:none;
        font-size:16px;
        outline:none;
    }

    #inputForm button {
        padding:14px 24px;
        border:none;
        background:#4A90E2;
        color:#fff;
        font-weight:500;
        cursor:pointer;
        transition: background 0.2s ease;
    }

    #inputForm button:hover {
        background:#357ABD;
    }

    /* Scrollbar stylée */
    #chat::-webkit-scrollbar { width:8px; }
    #chat::-webkit-scrollbar-track { background:#f2f5f9; }
    #chat::-webkit-scrollbar-thumb { background:#4A90E2; border-radius:4px; }

    @media(max-width:640px){
        #chat{height:400px;}
        #messageInput{font-size:14px;padding:12px;}
        #inputForm button{padding:12px 18px;}
    }
</style>
</head>
<body>

<h1>Chatbot Santé Mentale</h1>
<div id="chat"></div>

<form id="inputForm">
    <input type="text" id="messageInput" placeholder="Tape ton message..." required />
    <button type="submit">Envoyer</button>
</form>

<script>
const chatDiv = document.getElementById("chat");
const inputForm = document.getElementById("inputForm");
const messageInput = document.getElementById("messageInput");
const API_URL = "http://localhost:8080/chat";

// Ajout message utilisateur
function addUserMessage(text) {
    const container = document.createElement("div");
    container.classList.add("message-container", "user");

    const avatar = document.createElement("div");
    avatar.classList.add("avatar");
    avatar.textContent = "U";

    const msg = document.createElement("div");
    msg.classList.add("message");
    msg.textContent = text;

    container.appendChild(msg);
    container.appendChild(avatar);
    chatDiv.appendChild(container);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

// Ajout message bot
function addBotMessage(text) {
    const container = document.createElement("div");
    container.classList.add("message-container", "bot");

    const avatar = document.createElement("div");
    avatar.classList.add("avatar");
    avatar.textContent = "B";

    const msg = document.createElement("div");
    msg.classList.add("message");
    container.appendChild(avatar);
    container.appendChild(msg);
    chatDiv.appendChild(container);
    chatDiv.scrollTop = chatDiv.scrollHeight;

    // Affichage texte lettre par lettre
    let i = 0;
    function typeWriter() {
        if(i < text.length){
            msg.textContent += text.charAt(i);
            i++;
            chatDiv.scrollTop = chatDiv.scrollHeight;
            setTimeout(typeWriter, 20);
        }
    }
    typeWriter();
}

// Message de “typing”
function addTypingMessage() {
    const container = document.createElement("div");
    container.classList.add("message-container", "bot");

    const avatar = document.createElement("div");
    avatar.classList.add("avatar");
    avatar.textContent = "B";

    const msg = document.createElement("div");
    msg.classList.add("message");

    for(let i=0;i<3;i++){
        const dot = document.createElement("span");
        dot.classList.add("typing-dot");
        msg.appendChild(dot);
    }

    container.appendChild(avatar);
    container.appendChild(msg);
    chatDiv.appendChild(container);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    return msg;
}

inputForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const text = messageInput.value.trim();
    if(!text) return;
    addUserMessage(text);
    messageInput.value="";

    const typingMsg = addTypingMessage();

    try{
        const res = await fetch('/chat',{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:text})
        });

        if(!res.ok) throw new Error("Erreur serveur");
        const data = await res.json();

        // Remplacer typing par vrai message
        typingMsg.parentElement.remove(); // Supprime le container typing
        addBotMessage(data.reply || "❌ Réponse vide du serveur");

    }catch(err){
        console.error(err);
        typingMsg.parentElement.remove();
        addBotMessage("❌ Erreur : le serveur ne répond pas.");
    }
});
</script>

</body>
</html>
